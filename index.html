<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Task Assignment</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>
  <main class="app-shell">
    <section id="loginPanel" class="login-wrap">
      <article class="card auth-card">
        <h1>Employee Task Assignment</h1>
        <p class="muted">Sign in to access tasks, vendors, and sales modules.</p>
        <form id="loginForm" class="form-grid">
          <label>Email<input id="loginEmail" type="email" required placeholder="name@company.com"></label>
          <label>Password<input id="loginPassword" type="password" required placeholder="••••••••"></label>
          <button type="submit">Login</button>
        </form>
      </article>
    </section>

    <section id="workspaceShell" class="workspace hidden">
      <aside class="sidebar">
        <div class="brand">
          <h2>TaskApp</h2>
          <p id="sessionLabel" class="muted"></p>
        </div>
        <nav id="navList" class="nav-list">
          <button data-page="tasks" class="active">Tasks</button>
          <button data-page="vendors">Vendor Database</button>
          <button data-page="sales">Sales & Orders</button>
          <button data-page="admin" id="adminNavBtn">Admin</button>
        </nav>
        <button id="logoutBtn" class="danger">Logout</button>
      </aside>

      <section class="content">
        <header class="topbar">
          <h1 id="pageTitle">Tasks</h1>
        </header>

        <section id="tasksPage" class="page active">
          <div class="grid two">
            <article class="card">
              <h3>Create Employee</h3>
              <form id="employeeForm" class="form-grid">
                <label>Name<input id="employeeName" type="text" placeholder="Employee name"></label>
                <label>Email<input id="employeeEmail" type="email" placeholder="employee@company.com"></label>
                <label>Password<input id="employeePassword" type="text" placeholder="Minimum 8 characters"></label>
                <label>Phone<input id="employeePhone" type="text" placeholder="9199..."></label>
                <button type="submit">Create Employee</button>
              </form>
            </article>

            <article class="card">
              <h3>Assign Task</h3>
              <form id="taskForm" class="form-grid">
                <label>Title<input id="taskTitle" type="text" required></label>
                <label>Assign To<select id="taskAssignee"></select></label>
                <label>Description<textarea id="taskDescription" rows="2"></textarea></label>
                <label>Due Date<input id="taskDueAt" type="datetime-local" required></label>
                <label>Urgency
                  <select id="taskUrgency">
                    <option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option>
                  </select>
                </label>
                <label>Reminder (minutes)<input id="taskReminderMinutes" type="number" min="1" value="60"></label>
                <label class="checkbox"><input id="taskPersistentReminders" type="checkbox" checked> Persistent reminders</label>
                <button type="submit">Create Task</button>
              </form>
            </article>
          </div>

          <article class="card">
            <div class="toolbar">
              <h3>Tasks</h3>
              <input id="taskSearch" type="search" placeholder="Search tasks">
            </div>
            <div id="taskList" class="table-wrap"></div>
          </article>
        </section>

        <section id="vendorsPage" class="page">
          <div class="grid two">
            <article class="card">
              <h3>Add Vendor</h3>
              <form id="vendorForm" class="form-grid">
                <label>Name<input id="vendorName" type="text" required></label>
                <label>Contact Email<input id="vendorContactEmail" type="email"></label>
                <label>Contact Phone<input id="vendorContactPhone" type="text"></label>
                <label>City<input id="vendorCity" type="text"></label>
                <label>Status
                  <select id="vendorStatus"><option>Active</option><option>Inactive</option></select>
                </label>
                <label>Goods<textarea id="vendorGoods" rows="2" placeholder="Comma separated"></textarea></label>
                <label>Default Cost<input id="vendorDefaultCostPrice" type="number" min="0" step="0.01" value="0"></label>
                <button type="submit">Save Vendor</button>
              </form>
            </article>

            <article class="card">
              <h3>Add Product</h3>
              <form id="productForm" class="form-grid">
                <label>Vendor<select id="productVendorId"></select></label>
                <label>Name<input id="productName" type="text" required></label>
                <label>Item Code<input id="productItemCode" type="text" required></label>
                <label>Quantity<input id="productQuantity" type="number" min="0" value="0"></label>
                <label>Category<input id="productCategory" type="text"></label>
                <label>Stock Status
                  <select id="productStockStatus"><option>In Stock</option><option>Low Stock</option><option>Out of Stock</option></select>
                </label>
                <button type="submit">Save Product</button>
              </form>
            </article>
          </div>
          <div class="grid two">
            <article class="card">
              <div class="toolbar">
                <h3>Vendors</h3>
                <input id="vendorSearch" type="search" placeholder="Search vendors">
              </div>
              <div id="vendorCards" class="cards"></div>
            </article>
            <article class="card">
              <div class="toolbar">
                <h3>Products</h3>
                <input id="productSearch" type="search" placeholder="Search products">
              </div>
              <div id="productTable" class="table-wrap"></div>
            </article>
          </div>
        </section>

        <section id="salesPage" class="page">
          <div class="grid two">
            <article class="card">
              <h3>Add Client</h3>
              <form id="clientForm" class="form-grid">
                <label>Name<input id="clientName" type="text" required></label>
                <label>Email<input id="clientEmail" type="email"></label>
                <label>Phone<input id="clientPhone" type="text"></label>
                <label>City<input id="clientCity" type="text"></label>
                <label>Status<select id="clientStatus"><option>Active</option><option>Inactive</option></select></label>
                <button type="submit">Save Client</button>
              </form>
            </article>
            <article class="card">
              <h3>Create Order</h3>
              <form id="orderForm" class="form-grid">
                <label>Order ID<input id="orderId" type="text" required></label>
                <label>Client<select id="orderClientId"></select></label>
                <label>Product<select id="orderProductId"></select></label>
                <label>Assigned Employee<select id="orderEmployeeId"></select></label>
                <label>Quantity<input id="orderQuantity" type="number" min="1" value="1"></label>
                <label>Due Date<input id="orderDueDate" type="datetime-local" required></label>
                <label>Status
                  <select id="orderStatus">
                    <option>Pending</option><option>Processing</option><option>Delivered</option><option>Cancelled</option>
                  </select>
                </label>
                <button type="submit">Save Order</button>
              </form>
            </article>
          </div>
          <article class="card">
            <div class="toolbar">
              <h3>Orders</h3>
              <input id="orderSearch" type="search" placeholder="Search by order/client/item">
            </div>
            <div id="orderTable" class="table-wrap"></div>
          </article>
        </section>

        <section id="adminPage" class="page">
          <div class="grid two">
            <article class="card">
              <h3>Create Manager</h3>
              <form id="managerForm" class="form-grid">
                <label>Name<input id="managerName" type="text" required></label>
                <label>Email<input id="managerEmail" type="email" required></label>
                <label>Phone<input id="managerPhone" type="text"></label>
                <label>Password (optional)<input id="managerPassword" type="text" placeholder="Auto-generated if empty"></label>
                <button type="submit">Generate Credentials</button>
              </form>
            </article>
            <article class="card">
              <h3>Accounts</h3>
              <div id="adminUsersTable" class="table-wrap"></div>
            </article>
          </div>
        </section>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
